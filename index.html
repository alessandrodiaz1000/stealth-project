<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0b">
<title>buon compleanno</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<p class="progress" aria-hidden="true"><span id="step">01</span> / <span id="total">10</span></p>

<main class="stage" id="stage">
  <div class="visual visual--photos is-paused" id="wall" aria-hidden="true"></div>

  <div class="visual visual--dest is-paused" id="destStage" hidden aria-hidden="true">
    <div class="globe-stack" id="globeStack">
      <div class="globe" id="globe">
        <div class="globe__mask">
          <div class="globe__track" id="globeTrack"></div>
          <div class="globe__shade" aria-hidden="true"></div>
        </div>
        <div class="globe__atmo" aria-hidden="true"></div>
        <div class="globe__ring"></div>
      </div>
      <div class="globe__ticker" id="globeTicker" aria-hidden="true">
        <div class="globe__ticker-track"></div>
      </div>
    </div>
  </div>

  <div class="textzone textzone--center" id="textzone">
    <div class="copy">
      <p class="line" id="line" aria-live="polite"></p>
      <p class="sub" id="sub" hidden></p>
    </div>
  </div>

  <div class="finale" id="finale" hidden>
    <h1>Buon compleanno amore.</h1>
    <p class="finale__sub">Ti amo.</p>
  </div>
</main>

<script src="js/app.js" defer></script>
</body>
</html>
